name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install build dependencies (Vulkan toolchain included)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libpipewire-0.3-dev \
            libvulkan-dev glslc glslang-tools libshaderc-dev
          git init /tmp/spirv-headers
          git -C /tmp/spirv-headers fetch --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git 6efe5ae6b7c6ad29da3f2cc3f164b9c3d72b78b1
          git -C /tmp/spirv-headers checkout --detach FETCH_HEAD
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build \
            -DCMAKE_INSTALL_PREFIX="$HOME/spirv"
          cmake --build /tmp/spirv-headers/build --target install
          echo "CMAKE_PREFIX_PATH=$HOME/spirv" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$HOME/spirv/include" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$HOME/spirv/include" >> "$GITHUB_ENV"
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sL -o $env:TEMP\vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          Start-Process -Wait -FilePath "$env:TEMP\vulkan_sdk.exe" -ArgumentList '--accept-licenses','--default','--root','C:\VulkanSDK'
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK installation not found under C:\VulkanSDK" }
          Add-Content $env:GITHUB_PATH "$sdk\Bin"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked --release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked --release
