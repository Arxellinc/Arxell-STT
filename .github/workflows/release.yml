name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--features vulkan"
          - platform: macos-latest
            args: "--features metal"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config git \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libpipewire-0.3-dev \
            libvulkan-dev glslc glslang-tools libshaderc-dev
          git init /tmp/spirv-headers
          git -C /tmp/spirv-headers fetch --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git 6efe5ae6b7c6ad29da3f2cc3f164b9c3d72b78b1
          git -C /tmp/spirv-headers checkout --detach FETCH_HEAD
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build \
            -DCMAKE_INSTALL_PREFIX="$HOME/spirv"
          cmake --build /tmp/spirv-headers/build --target install
          echo "CMAKE_PREFIX_PATH=$HOME/spirv" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$HOME/spirv/include" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$HOME/spirv/include" >> "$GITHUB_ENV"
      - name: Install frontend tooling
        run: npm ci
      - name: Build and attach release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Arxell Speak ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
