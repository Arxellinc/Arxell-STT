[package]
name = "arxell-speak"
version = "0.1.2-rc.4"
description = "Local dictation for Arxell"
authors = ["Arxell"]
edition = "2024"

[lib]
name = "arxell_speak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.15"
earshot = "=1.2.2"
rubato = { version = "0.16", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
getrandom = "0.3"
tauri-plugin-global-shortcut = "2"
# GPU acceleration is mandatory, not a feature toggle. The platform tables
# below force Metal (macOS) and Vulkan (Linux/Windows) into EVERY build,
# including `cargo build --no-default-features`; a CPU-only binary cannot be
# produced. CPU remains a runtime fallback (BackendPreference::Auto) and a
# manual setting, never a silently weaker build.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", tag = "v0.4.1", package = "transcribe-cpp", default-features = false }

[dev-dependencies]
hound = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", tag = "v0.4.1", package = "transcribe-cpp", default-features = false, features = ["metal"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", tag = "v0.4.1", package = "transcribe-cpp", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
futures-util = "0.3"
x11-dl = "2"
gtk = "0.18"
gdkwayland-sys = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
